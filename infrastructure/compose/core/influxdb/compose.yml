services:
  influxdb:
    image: influxdb:2.7
    container_name: ${INFLUXDB_CONTAINER}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      #INFLUXDB_INIT_MODE: setup
      #INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      #INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-Pltsapp2026**}
      #INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-energy_platform}
      #INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      #INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-Pltsapp2026**}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-energy_platform}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - /opt/energy/data/influxdb:/var/lib/influxdb2
      - /opt/energy/backup/influxdb:/backup
    networks:
      - energy-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  energy-core:
    external: true
