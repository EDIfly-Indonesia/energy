services:
  postgres:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    ports:

      - "${POSTGRES_PORT}:5432"
    volumes:
      - /opt/energy/data/postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - energy-core
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  pgadmin:
      image: dpage/pgadmin4:8.14
      container_name: pgadmin_server
      restart: unless-stopped
      env_file:
        - .env
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
        PGADMIN_CONFIG_SCRIPT_NAME: '"/pgadmin"'
        TZ: ${TZ}
      ports:
        - "${PGADMIN_PORT}:80"
      volumes:
        - /opt/energy/data/pgadmin:/var/lib/pgadmin
      networks:
        - energy-core
      depends_on:
        postgres:
          condition: service_healthy

networks:
  energy-core:
    external: true
