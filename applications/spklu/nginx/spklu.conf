    # =============================================================
    # SPKLU (GoCaz) — EV Charging
    # Routing sesuai Flutter .env:
    #   BASE_URL       = /spklu/api
    #   uploads        = /spklu/dashboard/uploads/{chargebox,area,berita/foto,berita/video,fasilitas}/
    #   eula/terms     = /spklu/eula.html , /spklu/termsofservice.html
    # =============================================================

    # --- Swagger UI: paksa trailing slash agar asset relatif ./static/* termuat ---
    location = /spklu/api/docs {
        return 301 /spklu/api/docs/;
    }

    # --- API (mobile + admin) di /spklu/api/ → backend :8080 (prefix di-strip) ---
    location /spklu/api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NOTE: Upgrade/Connection header sengaja TIDAK diteruskan di sini (SEC-01)
        # agar OCPP WebSocket tidak terpublikasi lewat prefix API publik.
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        client_max_body_size 100m;
    }

    # --- Uploads statis (dilayani backend @fastify/static) ---
    location /spklu/dashboard/uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
    }

    # --- APK download + version check (self-update Android) ---
    location = /spklu/download_apk/version.json {
        alias /opt/energy/applications/spklu/apk/version.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }
    location /spklu/download_apk/ {
        alias /opt/energy/applications/spklu/apk/;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    # --- Dashboard React (build statis, base '/spklu/') + eula/terms ---
    location /spklu/ {
        alias /opt/energy/applications/spklu/dashboard/dist/;
        try_files $uri $uri/ /spklu/index.html;
    }
    location = /spklu {
        return 301 /spklu/;
    }

    # -------------------------------------------------------------
    # OCPP WebSocket (chargebox) & non-OCPP TCP (8484) — CATATAN:
    #   - OCPP WS: chargebox konek ke wss://<host>/<chargebox_id> (path = id).
    #     Direkomendasikan port/subdomain tersendiri (expose 8080 langsung, atau
    #     subdomain ocpp.* → proxy 127.0.0.1:8080 dengan header Upgrade).
    #   - non-OCPP TCP (8484) adalah raw TCP — expose via port mapping/firewall.
    # -------------------------------------------------------------
