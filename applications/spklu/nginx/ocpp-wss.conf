    # =============================================================
    # SPKLU — OCPP WebSocket (charge point / mesin charger)
    # =============================================================
    # URL untuk mesin:  wss://energy.edifly-si.com/ocpp/<chargebox_id>
    # Contoh:           wss://energy.edifly-si.com/ocpp/EZ81920
    #
    # Backend mengambil segmen path TERAKHIR sebagai identity, jadi prefix
    # /ocpp/ di sini bebas asal segmen terakhirnya chargebox_id. Identity
    # harus ada di tabel t_chargebox; kalau tidak, handshake ditolak 404.
    #
    # Subprotocol WAJIB `ocpp1.6`. Mesin yang mengirim `ocpp1.6j` atau
    # `ocpp2.0.x` akan ditolak server.
    #
    # Catatan keamanan: ini SATU-SATUNYA jalur yang meneruskan header Upgrade.
    # Blok /spklu/api/ sengaja tidak, supaya OCPP tidak ikut terekspos lewat
    # prefix API publik.
    location /ocpp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Header wajib untuk upgrade WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Koneksi OCPP berumur panjang: heartbeat 60 detik, sesi charging bisa
        # berjam-jam. Timeout pendek akan memutus mesin di tengah sesi.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # WebSocket tidak boleh di-buffer.
        proxy_buffering off;

        # Opsional: batasi hanya ke IP mesin charger bila IP-nya statis.
        # Buka komentar dan sesuaikan. Default: terbuka (auth lewat identity).
        # allow 103.23.198.0/24;
        # deny all;
    }
